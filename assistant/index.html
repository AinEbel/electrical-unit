<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16232F">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Electrical Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: control-room console. Fixed nav rail (top strip on phones), one working pane, nameplate-style panels. */
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --sunk:#E3E8EE; --line:#CDD5DE; --ink:#14202B; --muted:#5A6878;
  --accent:#B86E00; --accent-ink:#FFFFFF; --accent-soft:#FBEBD2;
  --ok:#1E7A46; --ok-soft:#DDF1E5; --warn:#A35C00; --warn-soft:#FCEBCF; --bad:#B42318; --bad-soft:#FBE1DE;
  --rail:#16232F; --rail-ink:#C9D4DE; --rail-active:#F2A93B;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151B; --panel:#162029; --sunk:#1D2933; --line:#2B3946; --ink:#E4EBF1; --muted:#93A3B3;
  --accent:#F2A93B; --accent-ink:#1A1206; --accent-soft:#3A2C14;
  --ok:#5CC98A; --ok-soft:#163626; --warn:#F2B35B; --warn-soft:#3A2B12; --bad:#F2877C; --bad-soft:#3E1C19;
  --rail:#0A1015; --rail-ink:#A9B7C4; --rail-active:#F2A93B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151B; --panel:#162029; --sunk:#1D2933; --line:#2B3946; --ink:#E4EBF1; --muted:#93A3B3;
  --accent:#F2A93B; --accent-ink:#1A1206; --accent-soft:#3A2C14;
  --ok:#5CC98A; --ok-soft:#163626; --warn:#F2B35B; --warn-soft:#3A2B12; --bad:#F2877C; --bad-soft:#3E1C19;
  --rail:#0A1015; --rail-ink:#A9B7C4; --rail-active:#F2A93B; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:2rem;font-weight:700}
h2{font-size:1.45rem;font-weight:600}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:18px;padding:20px 12px;padding-left:max(12px,env(safe-area-inset-left,0px))}
[dir="rtl"] .rail{padding-left:12px;padding-right:max(12px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.35rem;font-weight:700;color:#fff;letter-spacing:.02em;line-height:1}
.brand span{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-ink);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);font-size:.92rem;color:var(--rail-ink);white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:rgba(242,169,59,.14);color:#fff;box-shadow:inset 3px 0 0 var(--rail-active)}
[dir="rtl"] .nav button[aria-current="page"]{box-shadow:inset -3px 0 0 var(--rail-active)}
.nav button:focus-visible{outline:2px solid var(--rail-active)}
.nav svg{flex:none;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.rail-foot select{background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:var(--r);padding:6px 8px;color:#fff;color-scheme:dark}
.rail-foot select option{color:#000}

.main{min-width:0;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:900px){.main{padding-left:36px;padding-right:max(36px,env(safe-area-inset-right,0px))}}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{color:var(--muted);max-width:62ch;margin-top:4px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel>h3{margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.spread{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:8px 14px;cursor:pointer;font-weight:500;font-size:.92rem;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted);font-weight:500;min-width:0}
input.i,select.i,textarea.i{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;color:var(--ink);font-size:.95rem}
textarea.i{resize:vertical;min-height:84px}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.76rem;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--sunk);padding:3px;border-radius:calc(var(--r) + 2px)}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:var(--r);font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--accent)}

.bar{height:6px;background:var(--sunk);border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:9px}
.stat b{display:block;font-family:var(--f-display);font-size:2.1rem;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}

.safety{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px}
.safety .stripe{flex:none;width:28px;height:28px;border-radius:4px;background:repeating-linear-gradient(135deg,var(--warn) 0 6px,transparent 6px 12px);border:1px solid var(--warn)}
.notice{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;color:var(--muted);font-size:.9rem}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--sunk);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{text-align:end;font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.md{line-height:1.6;overflow-wrap:anywhere}
.md>*+*{margin-top:.6em}
.md h1,.md h2,.md h3,.md h4{font-family:var(--f-display);margin-top:1em}
.md h1{font-size:1.5rem}.md h2{font-size:1.3rem}.md h3,.md h4{font-size:1.1rem}
.md ul,.md ol{padding-inline-start:1.3em;margin-bottom:0}
.md code{font-family:var(--f-mono);font-size:.88em;background:var(--sunk);padding:1px 5px;border-radius:4px}
.md pre{background:var(--sunk);padding:10px;border-radius:var(--r);overflow-x:auto}
.md pre code{background:none;padding:0}
.md table{display:block;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.md blockquote{margin:0;padding:8px 12px;border-inline-start:3px solid var(--warn);background:var(--warn-soft);border-radius:4px}
.md details{background:var(--sunk);padding:8px 12px;border-radius:var(--r)}

/* chat */
.chat{display:flex;flex-direction:column;gap:14px;min-height:240px}
.msg{display:flex;flex-direction:column;gap:6px;max-width:100%}
.msg.u{align-self:flex-end;max-width:min(80%,640px)}
.msg.u .bub{background:var(--accent-soft);border:1px solid transparent}
.bub{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.msg-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.composer{position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.composer .box{display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.composer textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;min-height:44px;max-height:180px;padding:8px;outline:none}
.cites{display:flex;flex-wrap:wrap;gap:6px}
.cite{font-size:.78rem;border:1px solid var(--line);border-radius:99px;padding:2px 9px;background:var(--sunk);cursor:pointer;color:var(--ink)}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* nameplate: used for equipment, scenario, certificate */
.plate{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,var(--sunk),var(--panel) 46px);padding:14px 16px;min-width:0}
.plate .readings{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.reading{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 9px}
.reading .v{font-family:var(--f-mono);font-size:1rem;font-variant-numeric:tabular-nums}
.alarm{font-family:var(--f-mono);font-size:.82rem;color:var(--bad);background:var(--bad-soft);border-radius:4px;padding:3px 8px;display:inline-block}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line);min-width:0}
.item:last-child{border-bottom:0}
.item .t{min-width:0;overflow-wrap:anywhere}
.lvl-head{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.course{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:start;width:100%}
.course:hover{border-color:var(--accent)}
.q{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.cert{border:2px solid var(--accent);border-radius:var(--r);padding:22px;background:var(--panel);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.cert h3{font-size:1.5rem}
.log{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow:auto}
.log .e{border-inline-start:3px solid var(--line);padding:4px 0;padding-inline-start:12px}
.log .e.me{border-color:var(--accent)}
.log .e.flag{border-color:var(--bad)}
mark{background:var(--accent-soft);color:inherit;padding:0 2px;border-radius:2px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:.9rem;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

@media(max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5;flex-wrap:wrap}
  [dir="rtl"] .rail{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand span{display:none}
  .rail-foot{margin:0;margin-inline-start:auto;flex-direction:row;padding:0}
  .rail-foot .who{display:none}
  .nav{flex-direction:row;order:3;width:100%;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .nav button{padding:7px 10px;font-size:.86rem}
  .nav button[aria-current="page"],[dir="rtl"] .nav button[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--rail-active)}
  .msg.u{max-width:92%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

{id:"sop-loto",title:"SOP-01 Lockout/Tagout (LOTO) for electrical equipment",text:`Purpose: isolate all hazardous energy before maintenance on electrical equipment.
1. Prepare: identify every energy source using the single-line diagram, including utility supply, generator, UPS output, DC batteries, capacitors, back-feed from parallel sources and control power.
2. Notify affected people and the control room. Obtain the permit to work.
3. Shut down the equipment using normal stopping procedures.
4. Isolate: open the isolating devices (breakers, switches, fuses). For draw-out breakers, rack to the disconnected or withdrawn position.
5. Lock and tag: each worker applies a personal lock and a tag with name, date and reason. Use a multi-lock hasp for group isolation.
6. Release stored energy: discharge capacitors (wait the time on the label, typically 5 minutes for UPS DC capacitors), block mechanical parts, isolate battery strings at the DC breaker.
7. Verify absence of voltage: wear PPE for the arc flash category. Test the voltage detector on a known live source, test all phases phase-to-phase and phase-to-earth, then retest the detector (live-dead-live).
8. Apply temporary earthing where required by site rules.
9. Restoration: remove tools and earths, check all workers are clear, each worker removes their own lock, notify affected people, re-energise in the planned sequence.
Never remove another person's lock. A lock may only be removed by its owner or under the site's documented lock-removal procedure.`},
{id:"sop-gen-pm",title:"SOP-02 Standby diesel generator weekly, monthly and annual maintenance",text:`Weekly (no-load or with ATS test): check engine oil level, coolant level, fuel day tank level, battery charger output (typically 27.2 V float for a 24 V lead-acid system), battery terminals for corrosion, air filter restriction indicator, leaks of oil, fuel or coolant, block heater operation (block temperature 30-40 C), controller alarms and event log. Run for 15-30 minutes. Record oil pressure, coolant temperature, voltage (all phases), frequency (50 Hz +/-0.5) and hours.
Monthly: run on load for at least 30 minutes at 30% or more of rated load to avoid wet stacking. Check belt tension, radiator fins, exhaust for leaks and excessive smoke, drain water from fuel water separator, check fuel quality, check battery specific gravity or voltage per cell (2.12-2.14 V per cell rested for flooded lead-acid).
Every 250 hours or 6 months: change engine oil and oil filter, change fuel filters (primary water separator and secondary), check coolant additive concentration.
Annual: load bank test for 2-4 hours at stepped loads up to 100% rated kW, change air filter, coolant test, inspect alternator windings and connections, insulation resistance test of alternator (minimum 1 megohm plus 1 megohm per kV, polarisation index above 2 preferred), check AVR settings, governor response, protection relay trip tests, torque check of power terminations with thermography under load.
Common faults: fails to start (battery voltage below 24 V while cranking under 18 V, starter solenoid, fuel solenoid, air in fuel), shutdown on low oil pressure, high coolant temperature (radiator blocked, thermostat, fan belt), overspeed (governor actuator, sticking fuel rack), under-voltage (AVR, sensing fuse, excitation diodes), over-voltage on load rejection.`},
{id:"sop-ups-batt",title:"SOP-03 UPS battery inspection, testing and replacement",text:`Applies to VRLA battery strings on online double-conversion UPS.
Safety: DC strings can exceed 400 V DC and cannot be switched off at the cells. Use insulated tools, face shield, rubber gloves class 0 minimum, remove metal jewellery, keep eye-wash available. Open the battery breaker and verify zero current before touching links.
Quarterly: visual inspection for swelling, cracks, leakage and terminal corrosion. Measure string float voltage (typically 2.25-2.27 V per cell at 20-25 C), individual block voltages (flag blocks deviating more than 0.05 V per cell from average), ambient temperature (every 10 C above 25 C halves VRLA life), and ripple current.
Semi-annual: measure internal resistance or impedance of each block. A block 25% above its baseline is suspect, 50% above is failed.
Annual: torque check of inter-cell connections to the manufacturer's value, thermography, discharge test at the UPS load or with a DC load bank to verify autonomy. Replace the string when capacity is below 80%.
Replacement: put the UPS on maintenance bypass per the manufacturer's procedure, open the battery breaker, replace blocks of the same type and date code, never mix old and new blocks in one string, check polarity, measure total string voltage before closing the breaker, then return the UPS to normal mode and record the autonomy.
Typical alarms: battery discharged, battery test failed, DC bus overvoltage (rectifier fault or charger setting), DC ground fault, battery temperature high.`},
{id:"sop-ats",title:"SOP-04 Automatic transfer switch (ATS) monthly test and troubleshooting",text:`Monthly test: notify users and the control room. Confirm the generator is in AUTO and the controller has no alarms. Initiate a test transfer from the ATS controller (simulated utility failure) rather than opening the utility breaker where possible. Record: engine start delay (typically 2-3 s), time to transfer (generator stable at rated voltage and frequency, normally under 10 s for emergency loads), load on generator, retransfer delay (commonly 5-30 minutes), cooldown time (commonly 5 minutes). Check for clean transfer without arcing noise or relay chatter.
Annual: with the ATS isolated and locked out, inspect main contacts for pitting, arc chutes, mechanism lubrication, control wiring, torque terminations, thermography under load before shutdown.
Troubleshooting: ATS will not retransfer to utility - check utility voltage and frequency are within the pickup setting on all three phases, phase rotation correct, retransfer timer running, controller inhibit or test switch left on, utility sensing fuse blown, motor operator or solenoid fault. ATS will not transfer to generator - generator voltage or frequency outside pickup, generator breaker open, controller not receiving start signal, transfer inhibit active. Repeated transfers - utility voltage unstable, dropout and pickup settings too close.`},
{id:"sop-motor-ir",title:"SOP-05 Motor insulation resistance (megger) testing",text:`Purpose: assess winding insulation of LV motors (up to 1000 V).
1. Isolate and lock out the motor starter or VFD. Prove dead at the motor terminals. Disconnect the motor cables from the VFD output (a megger test can destroy VFD semiconductors).
2. Clean the terminal box. Record ambient temperature and humidity.
3. Select test voltage: 500 V DC for motors rated up to 400 V, 1000 V DC for motors 400-1000 V.
4. Test each phase to earth and phase to phase where windings can be separated. Apply for 1 minute and record the reading. For the polarisation index, record at 1 minute and 10 minutes.
5. Acceptance (IEEE 43 guidance): minimum 5 megohm for random-wound motors at 40 C corrected; readings above 100 megohm are typically good. Correct readings to 40 C (halve the value for every 10 C above, double for every 10 C below). PI below 1 is poor, 1-2 questionable, above 2 good.
6. Discharge the winding after each test for at least four times the test duration, or use the instrument's auto-discharge.
7. Measure winding resistance with a micro-ohmmeter: phase imbalance above 2% indicates shorted turns or loose connections.
Low readings: moisture (dry with space heaters or low-voltage current and retest), contamination, damaged leads, winding breakdown.`},
{id:"sop-acb",title:"SOP-06 Low-voltage air circuit breaker (ACB) maintenance",text:`Frequency: annually, or after a fault interruption near the rated breaking capacity.
1. Open the breaker, rack it to the disconnected position, lock out and verify dead on line and load side. Withdraw it to the maintenance position using the lifting device.
2. Inspect arc chutes for cracking and contamination, main contacts for erosion (replace when contact wear indicator reaches limit), clean with dry lint-free cloth, do not file silver contacts.
3. Lubricate the mechanism with the manufacturer's grease only. Operate mechanically 5-10 times. Check closing and opening springs, anti-pumping, shunt trip and undervoltage release operation.
4. Measure contact resistance with a 100 A DC micro-ohmmeter; compare phases and with the previous record. More than 50% increase indicates contact problems.
5. Insulation resistance test at 1000 V DC between phases and phase to earth with the breaker closed, and across open contacts.
6. Test the electronic trip unit with the secondary injection kit: long time, short time, instantaneous and earth fault pick-ups and delays per the selectivity study settings. Record settings before and after.
7. Rack in, close, check auxiliary contacts and remote indication, and carry out thermography on load.
Common faults: breaker will not close (springs not charged, UV release not energised, mechanical interlock, trip unit fault signal), nuisance tripping (wrong settings, earth fault from load, CT wiring).`}

const STOP=new Set("the a an and or of to in on for with is are be at by it this that how what why do does i my we our from as can should when which le la les des un une et ou de du en pour avec est sont au aux".split(" "));
const toks=s=>String(s).toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").split(/[^\p{L}\p{N}.\-]+/u).filter(w=>w.length>1&&!STOP.has(w));
function chunkText(text,size=1400,overlap=200){const out=[];const clean=text.replace(/\s+\n/g,"\n").replace(/[ \t]+/g," ").trim();for(let i=0;i<clean.length;i+=size-overlap){out.push(clean.slice(i,i+size));if(i+size>=clean.length)break}return out}
let builtinChunks=null;
function allChunks(){
  if(!builtinChunks)builtinChunks=KB_BUILTIN.flatMap(d=>chunkText(d.text).map((x,n)=>({doc:d.id,title:d.title,n,text:x,builtin:true})));
  return builtinChunks.concat(S.chunks||[]);
}
async function loadChunks(){
  if(S.chunks)return;if(!db||!S.canWrite){S.chunks=[];return}
  try{const snap=await db.collection("ea_kbchunks").get();S.chunks=snap.docs.map(d=>d.data())}catch(e){S.chunks=[]}
}
function searchKb(q,k=5){
  const qt=[...new Set(toks(q))];if(!qt.length)return [];
  const docs=allChunks();const N=docs.length;const df={};
  const tk=docs.map(d=>{const ts=toks(d.title+" "+d.text);const set=new Set(ts);qt.forEach(w=>{if(set.has(w))df[w]=(df[w]||0)+1});return ts});
  const avg=tk.reduce((a,x)=>a+x.length,0)/Math.max(1,N);
  return docs.map((d,i)=>{const tf={};tk[i].forEach(w=>{tf[w]=(tf[w]||0)+1});let s=0;qt.forEach(w=>{if(!tf[w])return;const idf=Math.log(1+(N-df[w]+.5)/(df[w]+.5));s+=idf*(tf[w]*2.2)/(tf[w]+1.2*(.25+.75*tk[i].length/avg))});return {...d,score:s}}).filter(d=>d.score>0).sort((a,b)=>b.score-a.score).slice(0,k);
}
function highlight(text,q){let h=esc(text);toks(q).slice(0,8).forEach(w=>{if(w.length<3)return;h=h.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>")});return h}

let chatAbort=null;
async function sendChat(){
  const q=$("#q");const text=q.value.trim();if(!text)return;
  if(chatAbort){chatAbort.abort();return}
  await loadChunks();
  const hits=searchKb(text+" "+(S.chat.filter(m=>m.role==="user").slice(-1)[0]?.content||""),4);
  const modeTxt={general:"",trouble:"Mode: troubleshooting. Give a structured fault-finding plan: safety precautions, most likely causes ranked, checks in order with expected readings, then corrective actions and when to escalate.",safety:"Mode: safety brief. Produce a job safety brief: hazards, isolation points and LOTO steps, PPE with arc-flash considerations, verification of absence of voltage, emergency actions.",trainee:"Mode: trainee. Explain in plain language for a beginner technician, define terms, use an analogy, finish with 3 quick self-check questions."}[S.mode];
  if(!sample){S.chat.push({role:"user",content:text});S.chat.push({role:"assistant",content:offlineAnswer(hits),sources:hits.slice(0,3).map(h=>({doc:h.doc,title:h.title}))});q.value="";$("#chat").innerHTML=S.chat.map(msgHtml).join("");return}
  const ctx=hits.length?"Reference excerpts:\n"+hits.map((h,k)=>`[S${k+1}] ${h.title}\n${h.text}`).join("\n\n"):"No reference excerpts matched.";
  const history=S.chat.filter(m=>m.content).slice(-10).map(m=>({role:m.role,content:m.content}));
  S.chat.push({role:"user",content:text});const a={role:"assistant",content:"",sources:hits.map(h=>({doc:h.doc,title:h.title}))};S.chat.push(a);
  q.value="";$("#chat").innerHTML=S.chat.map(msgHtml).join("");
  const btn=$("#sendBtn");btn.innerHTML=`<span>${esc(t("stop"))}</span>`;
  chatAbort=new AbortController();
  const el=()=>document.getElementById("m"+S.chat.indexOf(a));
  try{
    const input=[...history,{role:"user",content:`${SYSTEM()}\n\n${modeTxt}\n\n${ctx}\n\nQuestion: ${text}`}];
    const out=await ai(input,{signal:chatAbort.signal,onText:({text})=>{a.content=text;const e=el();if(e)e.innerHTML=md(text)}});
    a.content=out;
  }catch(e){if(e&&e.name!=="AbortError"&&e.code!=="aborted")a.content=a.content||("_"+errMsg(e)+"_")}
  chatAbort=null;
  if(S.view==="chat"){$("#chat").innerHTML=S.chat.map(msgHtml).join("");const b=$("#sendBtn");if(b)b.innerHTML=`${ic("send")}<span>${esc(t("send"))}</span>`}
  if(!a.content)S.chat.splice(S.chat.indexOf(a),1);
}

async function genQuiz(){
  const cid=$("#qc")?.value||S.qcourse||COURSES[0].id;S.qcourse=cid;const c=COURSES.find(x=>x.id===cid);const mode=S.qmode||"quiz";const n=mode==="exam"?10:5;
  if(!sample){const bank=QBANK[cid]||[];const pick=shuffle(bank).slice(0,mode==="exam"?bank.length:5).map(([q,opts,ans,ex])=>{const o=shuffle([0,1,2,3]);return {q,options:o.map(k=>opts[k]),answer:o.indexOf(ans),explain:ex}});
    S.quiz={questions:pick,answers:{},mode,course:c.t,courseId:c.id,level:c.lv};return renderView()}
  S.quiz={loading:true};renderView();
  try{
    const r=await ai(`You write assessment questions for electrical maintenance technicians.\nCourse: ${c.t} (${c.lv} level). Topics: ${c.ls.join("; ")}.\nWrite ${n} multiple-choice questions${mode==="exam"?" for a certification exam covering every topic, mixing recall, applied calculation and practical scenario questions":" for practice"}. Each has exactly 4 options and one correct answer. Vary the position of the correct answer. Include at least one safety question. Make wrong options plausible.\nWrite questions, options and explanations in ${LANGNAME[S.lang]}.\nReturn JSON only: {"questions":[{"q":"...","options":["...","...","...","..."],"answer":0,"explain":"one or two sentences on why"}]}`,{json:true});
    const qs=(r&&r.questions||[]).filter(x=>x&&x.q&&Array.isArray(x.options)&&x.options.length===4&&Number.isInteger(+x.answer)).map(x=>({...x,answer:+x.answer}));
    if(!qs.length)throw {message:"no questions"};
    S.quiz={questions:qs,answers:{},mode,course:c.t,courseId:c.id,level:c.lv};
  }catch(e){S.quiz=null;toast(errMsg(e))}

}
function grade(){
  const q=S.quiz;if(Object.keys(q.answers).length<q.questions.length)return toast(t("answer_all"));
  const right=q.questions.filter((x,i)=>q.answers[i]===x.answer).length;q.score=Math.round(right/q.questions.length*100);q.graded=true;
  S.st.attempts.unshift({course:q.course,courseId:q.courseId,mode:q.mode,score:q.score,at:Date.now()});S.st.attempts=S.st.attempts.slice(0,50);
  let xp=right*2;
  if(q.mode==="exam"&&q.score>=80){
    q.cert={code:"EA-"+Date.now().toString(36).toUpperCase().slice(-5)+"-"+uidShort().slice(0,3).toUpperCase(),course:q.course,courseId:q.courseId,level:q.level,score:q.score,at:Date.now(),name:S.name};
    S.st.certs=S.st.certs.filter(c=>c.courseId!==q.courseId);S.st.certs.unshift(q.cert);xp+=100;toast(t("cert_earned"));
  }else if(q.score>=80)xp+=25;
  addXp(xp);renderView();
}

const shuffle=arr=>{const x=[...arr];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};
function offlineAnswer(hits){
  if(!hits.length)return "**"+t("offline_chat")+"**\n\n"+t("offline_none");
  return "**"+t("offline_chat")+"**\n\n"+hits.slice(0,3).map((h,k)=>`**[S${k+1}] ${h.title}**\n\n${h.text.slice(0,900)}${h.text.length>900?"…":""}`).join("\n\n---\n\n");
}
function offlineLesson(c,i){
  const hits=searchKb(c.ls[i]+" "+c.t,2);
  return `## ${c.ls[i]}\n\n_${c.d}_\n\n### ${t("offline_outline")}\n${c.ls.map((l,k)=>k===i?`- **${l}**`:`- ${l}`).join("\n")}\n\n${hits.length?`### ${t("offline_related")}\n\n`+hits.map(h=>`**${h.title}**\n\n${h.text.slice(0,1100)}…`).join("\n\n"):""}\n\n> ${t("offline_lesson")}`;
}
function offlinePlan(goal){
  const lv=levelOf(S.st.xp);
  const todo=COURSES.filter(c=>(S.st.progress[c.id]||[]).length<c.ls.length).sort((a,b)=>Math.abs(LEVELS.indexOf(a.lv)-lv)-Math.abs(LEVELS.indexOf(b.lv)-lv)||LEVELS.indexOf(a.lv)-LEVELS.indexOf(b.lv)).slice(0,4);
  const rows=todo.map((c,k)=>`| ${k*2+1}–${k*2+2} | ${c.t} (${c.ls.length} ${t("lessons")}) | ${t("quiz")} + ${t("nav_sim")}: ${catName(c.cat||CATS[k%CATS.length])} | ${t("exam")} ≥ 80% |`).join("\n");
  return `${goal?`**${t("plan_goal")}:** ${goal}\n\n`:""}| # | ${t("nav_train")} | ${t("quick_actions")} | ✓ |\n|---|---|---|---|\n${rows}`;
}

after.sim=()=>{const i=$("#simact");if(i)i.addEventListener("keydown",e=>{if(e.key==="Enter")simDo()});const l=$("#simlog");if(l)l.scrollTop=l.scrollHeight};
async function simStart(){
  const cat=S.simCat||"generator",diff=S.simDiff||"medium";
  if(!sample){const pool=SIMS.filter(x=>x.cat===cat);const same=pool.filter(x=>x.diff===diff);let opts=(same.length?same:pool).filter(x=>x.title!==S.sim?.sc?.title);if(!opts.length)opts=pool;
    const sc={...opts[Math.floor(Math.random()*opts.length)]};sc.hidden={fault:sc.options[sc.answer],root_cause:""};
    S.sim={offline:true,cat,diff:sc.diff,sc,readings:{...sc.readings},alarms:[...sc.alarms],log:[],locked:false,flags:[],done:[]};return renderView()}
  S.sim={loading:true};renderView();
  try{
    const sc=await ai(`You run a fault-finding simulator for electrical maintenance technicians. Create one realistic fault scenario.\nEquipment type: ${cat}. Difficulty: ${diff} (easy = single obvious fault; medium = needs 3-5 checks; hard = misleading symptom or two interacting issues).\nUse a realistic facility setting (data centre, hospital, office HQ) with plausible ratings and readings. Do not reveal the fault in the visible fields.\nWrite all text in ${LANGNAME[S.lang]} (keys stay in English).\nReturn JSON only: {"title":"short","equipment":"make-agnostic description with ratings, e.g. 600 kVA 400/230 V diesel genset","context":"2-3 sentences: site, what happened, who called","symptoms":["..."],"alarms":["controller alarm text"],"readings":{"label with unit":"value"},"hidden":{"fault":"the actual fault","root_cause":"why it happened","correct_fix":"repair","key_checks":["checks an expert would do in order"],"safety_critical":["safety steps required before hands-on work"]}}`,{json:true,tier:"complex"});
    if(!sc||!sc.title||!sc.hidden)throw {message:"bad scenario"};
    S.sim={cat,diff,sc,readings:{...(sc.readings||{})},alarms:[...(sc.alarms||[])],log:[],locked:false};
  }catch(e){S.sim=null;toast(errMsg(e))}
  renderView();
}
async function simDo(text){
  const s=S.sim;if(!s||s.busy)return;const inp=$("#simact");text=text||inp?.value.trim();if(!text)return;
  s.log.push({role:"me",text});s.busy=true;renderView();
  try{
    const r=await ai(`You are the simulator engine for a technician fault-finding exercise. Stay in the scenario. Respond to the technician's action with what they observe, as a realistic simulation. Do not reveal the fault or give the answer; give only observations and measured values. If the action is unsafe (hands-on or opening covers without isolation/LOTO when required, wrong PPE, working on a DC string without opening the battery breaker, defeating interlocks), describe the hazard briefly and set safety_flag. If they apply isolation, track that the equipment is now de-energised (live readings drop to zero; insulation and resistance tests become possible).\nScenario (secret): ${JSON.stringify(s.sc)}\nCurrent readings: ${JSON.stringify(s.readings)}\nActive alarms: ${JSON.stringify(s.alarms)}\nPrevious steps: ${JSON.stringify(s.log.slice(0,-1).map(l=>(l.role==="me"?"TECH: ":"SIM: ")+l.text))}\nTechnician action: ${text}\nWrite text in ${LANGNAME[S.lang]}.\nReturn JSON only: {"observation":"2-4 sentences","readings":{"label with unit":"value"} (only new or changed readings, may be empty),"alarms":["full list of active alarms after the action"],"safety_flag":"short text or empty string"}`,{json:true});
    if(r.readings&&typeof r.readings==="object")Object.assign(s.readings,r.readings);
    if(Array.isArray(r.alarms))s.alarms=r.alarms;
    s.log.push({role:"sim",text:String(r.observation||""),flag:r.safety_flag||""});
  }catch(e){s.log.push({role:"sim",text:"_"+errMsg(e)+"_"})}
  s.busy=false;if(S.view==="sim")renderView();
}
function simLoto(){const s=S.sim;if(!s||s.locked)return;s.locked=true;s.log.push({role:"me",text:t("qa_loto")});const fl=s.sc.lotoFlag||"";if(fl)s.flags.push(fl);s.log.push({role:"sim",text:s.sc.loto,flag:fl});renderView()}
function simCheck(i){
  const s=S.sim,c=s.sc.checks[i];s.done.push(i);s.log.push({role:"me",text:c.label});
  if(c.flag){s.flags.push(c.flag);s.log.push({role:"sim",text:c.result,flag:c.flag})}
  else if(c.hands&&!s.locked){const f=t("offline_unsafe");s.flags.push(f);s.done.pop();s.log.push({role:"sim",text:t("offline_isolate_first"),flag:f})}
  else if(c.live&&s.locked){s.log.push({role:"sim",text:t("offline_isolated")})}
  else s.log.push({role:"sim",text:c.result});
  renderView();
}
async function simDiag(){
  const s=S.sim;
  if(s&&s.offline){const pick=document.querySelector('input[name="simopt"]:checked');if(!pick)return toast(t("answer_all"));
    const right=+pick.value===s.sc.answer;const keys=s.sc.checks.map((c,i)=>c.key?i:-1).filter(i=>i>=0);const kd=keys.filter(i=>s.done.includes(i)).length;const extra=s.done.filter(i=>!s.sc.checks[i].key).length;
    const score=Math.round((right?50:0)+Math.max(0,25-12.5*s.flags.length)+Math.max(0,Math.min(25,kd/keys.length*25-3*extra)));
    s.debrief={score,feedback:(right?"✓ ":"✗ ")+s.sc.explain,safety:[...new Set(s.flags)],ideal:s.sc.ideal};
    S.st.sims.unshift({cat:s.cat,title:s.sc.title,score,at:Date.now()});S.st.sims=S.st.sims.slice(0,40);addXp(score>=70?30:10);return renderView()}const d=$("#simdiag")?.value.trim();if(!d||!s)return;
  s.busy=true;renderView();
  try{
    const r=await ai(`Score a technician's fault-finding exercise as a strict but fair senior engineer.\nScenario with the real fault: ${JSON.stringify(s.sc)}\nTechnician's steps: ${JSON.stringify(s.log.map(l=>(l.role==="me"?"TECH: ":"SIM: ")+l.text+(l.flag?" [SAFETY FLAG: "+l.flag+"]":"")))}\nTechnician's diagnosis and repair: ${d}\nScoring: diagnosis correctness 50, logical efficient checks 25, safety behaviour 25 (deduct for every safety flag and for skipping isolation before hands-on work).\nWrite text in ${LANGNAME[S.lang]}.\nReturn JSON only: {"score":0-100,"feedback":"Markdown, 80-150 words: what was right, what was missed","safety":["safety remarks"],"ideal":["expert step-by-step path"]}`,{json:true});
    s.debrief={score:Math.max(0,Math.min(100,Math.round(+r.score||0))),feedback:r.feedback||"",safety:r.safety||[],ideal:r.ideal||[]};
    S.st.sims.unshift({cat:s.cat,title:s.sc.title,score:s.debrief.score,at:Date.now()});S.st.sims=S.st.sims.slice(0,40);
    addXp(s.debrief.score>=70?30:10);
  }catch(e){toast(errMsg(e))}
  s.busy=false;renderView();
}

async function extractText(file){
  if(/\.pdf$/i.test(file.name)||file.type==="application/pdf"){
    if(!window.pdfjsLib)throw {message:"PDF reader unavailable"};
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let out="";
    for(let p=1;p<=pdf.numPages;p++){const c=await (await pdf.getPage(p)).getTextContent();out+=`\n[p.${p}] `+c.items.map(i=>i.str+(i.hasEOL?"\n":" ")).join("")}
    return out;
  }
  return await file.text();
}
async function uploadFiles(files){
  const st=$("#upStatus");
  for(const file of files){
    try{
      st.textContent=`${t("reading_file")} ${file.name}…`;
      const text=(await extractText(file)).trim();if(text.length<20)throw {message:"no readable text (scanned PDF?)"};
      const chunks=chunkText(text).slice(0,300);const id="d"+Date.now().toString(36)+uidShort().slice(0,4);const title=file.name.replace(/\.(pdf|txt|md)$/i,"");
      await db.doc("ea_kb/"+id).set({id,title,n:chunks.length,chars:text.length,by:S.uid,byName:S.name,at:Date.now()});
      for(let i=0;i<chunks.length;i++){st.textContent=`${t("uploading")} ${file.name} ${i+1}/${chunks.length}`;await db.doc(`ea_kbchunks/${id}_${i}`).set({doc:id,title,n:i,text:chunks[i]})}
      S.chunks=null;toast(`${t("saved")}: ${title}`);
    }catch(e){toast(`${file.name}: ${errMsg(e)}`)}
  }
  st.textContent="";
}

let aiCfg={};
function makeSample(){
  async function call(input,o={}){
    const messages=typeof input==="string"?[{role:"user",content:input}]:input;
    const hd={"content-type":"application/json"};if(fauth.currentUser)hd.authorization="Bearer "+await fauth.currentUser.getIdToken();
    const res=await fetch(aiCfg.proxy,{method:"POST",signal:o.signal,headers:hd,body:JSON.stringify({model:MODEL,max_tokens:8000,stream:true,messages})});
    if(!res.ok){let m="HTTP "+res.status;try{const j=await res.json();m=(j.error&&j.error.message)||j.error||m}catch{}throw {code:res.status===429||res.status===529?"rate_limited":"api_error",message:m}}
    const rd=res.body.getReader(),dec=new TextDecoder();let buf="",text="",stop="";
    for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let k;
      while((k=buf.indexOf("\n\n"))>=0){const ev=buf.slice(0,k);buf=buf.slice(k+2);
        for(const line of ev.split("\n")){if(!line.startsWith("data:"))continue;let j;try{j=JSON.parse(line.slice(5))}catch{continue}
          if(j.type==="content_block_delta"&&j.delta&&j.delta.type==="text_delta"){text+=j.delta.text;o.onText&&o.onText({text,delta:j.delta.text})}
          else if(j.type==="message_delta"&&j.delta)stop=j.delta.stop_reason||stop;
          else if(j.type==="error")throw {code:j.error&&j.error.type==="overloaded_error"?"rate_limited":"api_error",message:j.error&&j.error.message}}}}
    return {text,truncated:stop==="max_tokens"};
  }
  const f=(i,o)=>call(i,o);
  f.json=async(i,o={})=>{const {text}=await call(i+"\n\nReply with the JSON object only, no code fences or commentary.",{signal:o.signal});
    const s=text.replace(/```(?:json)?/g,"");const a=s.indexOf("{"),b=s.lastIndexOf("}");try{return JSON.parse(s.slice(a,b+1))}catch{throw {code:"invalid_json",message:"The AI reply was not valid JSON. Try again."}}};
  return f;
}
