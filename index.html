<style>

<header>
  <div class="wrap">
    <div class="brand">
      <div class="bolt" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></div>
      <div><h1>Critical Staff</h1><div class="sub">Naqoura - Sector West · v25</div></div>
      <div class="me" id="me"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<div id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<main class="wrap" id="view"><div class="empty"><b>Loading</b>Connecting to the team database.</div></main>

<script>
/* ---------- setup ---------- */
const CFG = window.EU_CONFIG || {};
const OWNER = String(CFG.ownerEmail || '').toLowerCase();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ym = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const shiftYm = (m, k) => { const [y, mo] = m.split('-').map(Number); return ym(new Date(y, mo - 1 + k, 1)); };
const ymLabel = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString(undefined, {month:'long', year:'numeric'}); };
const daysIn = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
function ago(ms){ if(!ms) return ''; const s=(Date.now()-ms)/1000;
  if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+' min ago'; if(s<86400) return Math.floor(s/3600)+' h ago';
  return new Date(ms).toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
function toast(msg, urgent){ const t=document.createElement('div'); t.className='toast'+(urgent?' u':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),urgent?10000:4000); }
function isoDay(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function remember(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

// only Convoy and Notes are shown on this page; the other tabs stay on the original Electrical Unit page
const TABS = [['convoy','Convoy'],['notes','Notes']];
const OWNER_TABS = ['convoy'];
const STATUS = {new:'New', progress:'In progress', waiting:'Waiting parts', done:'Done'};
const MARKS = [['P','Present'],['A','Absent'],['L','Leave'],['S','Sick'],['O','Off']];

const S = { user:null, email:'', owner:false, me:null, team:{}, attendance:{}, notes:[], loaded:false,
  tab: remember('eu.tab') || 'convoy', orders:[], support:[], orderFilter:'open', supportFilter:'pending', openSupportId:null, openOrder:null, month: ym(new Date()), noteFilter:'pending', sites:[], readings:{}, kMonth: ym(new Date()), kFind:'', authMode:'signin', authMsg:'',
  cvStaff:[], cvLoaded:false, cvCards:{}, cv:{date:'', direction:''}, cvCars:[], cvTrip: remember('eu.cvTrip') || '', cvDays:{}, cvDate: isoDay(new Date()), cvMonth: isoDay(new Date()).slice(0, 7), cvInfoLoaded:false, cvSecs:null, cvSec:'', cvOnly:false, cvQuery:'', cvBusy:false };
let cvCardsOn = false;

if (!CFG.firebase || !CFG.firebase.apiKey) {
  $('#view').innerHTML = `<div class="gate stack"><h2>Setup needed</h2><p class="muted">Open <b>config.js</b> and paste your Firebase settings and your own email, as the setup guide explains.</p></div>`;
  throw new Error('config.js missing');
}
firebase.initializeApp(CFG.firebase);
const auth = firebase.auth();
const db = firebase.firestore();
let unsubs = [];
let dataOn = false;

/* ---------- sign in ---------- */
auth.onAuthStateChanged(u => {
  unsubs.forEach(f => f()); unsubs = []; dataOn = false; cvCardsOn = false; S.cvStaff = []; S.cvCards = {}; S.cvLoaded = false;
  S.user = u; S.email = u && u.email ? u.email.toLowerCase() : ''; S.owner = !!u && u.emailVerified && S.email === OWNER;
  S.team = {}; S.attendance = {}; S.notes = []; S.loaded = false; S.me = null;
  if (u && u.emailVerified) listen();
  render();
});

function listen(){
  const fail = e => { console.warn(e); if (e.code === 'permission-denied') { S.loaded = true; render(); } };
  if (S.owner) {
    unsubs.push(db.collection('team').onSnapshot(s => { S.team = {}; s.forEach(d => S.team[d.id] = d.data()); S.loaded = true; render(); }, fail));
  } else {
    unsubs.push(db.collection('team').doc(S.email).onSnapshot(d => {
      S.me = d.exists ? d.data() : null; S.loaded = true;
      if (S.me && S.me.active && !dataOn) listenTeamData();

    unsubs.push(db.collection('convoyInfo').onSnapshot(s => {

      const put = (date, T, rec) => { if (!date || !TRIP[T]) return; const d = days[date] = days[date] || {};
        if (!d[T] || rank[rec.src] > rank[d[T].src]) d[T] = rec; };
      s.forEach(d => { const x = d.data();
        if (d.id === 'vehicles') S.cvCars = x.list || [];
        else if (d.id === 'current') S.cv = {date: x.date || '', direction: x.direction || ''};
        else if (d.id === 'sections') S.cvSecs = x.list || null;
        else if (x.kind === 'day') put(x.date, x.dir, {src: 'day', people: x.people || {}, drivers: x.drivers || {}, staff: x.staff, vehicles: x.vehicles});
        else if (x.kind === 'saved') { const people = {}, drivers = {}; (x.staff || []).forEach(p => people[p.key] = p.plate || ''); (x.vehicles || []).forEach(v => { if (v.driver) drivers[v.plate] = v.driver; });
          put(x.date, x.dir, {src: 'saved', people, drivers, staff: x.staff, vehicles: x.vehicles}); }
        else if (d.id === 'tripTO' || d.id === 'tripFROM') put(x.date, d.id.slice(4), {src: 'trip', people: x.people || {}, drivers: x.drivers || {}}); });
      S.cvDays = days; S.cvInfoLoaded = true; render(); }, e => console.warn(e)));
  }
}

function attXlsx(btn){

    const dow = d => new Date(y, mo - 1, d).getDay(), we = d => dow(d) % 6 === 0;
    const wb = new ExcelJS.Workbook(); wb.creator = 'Electrical Unit';
    const ws = wb.addWorksheet(ymLabel(m), {pageSetup: {orientation: 'landscape', paperSize: 9, fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: {left: .3, right: .3, top: .4, bottom: .4, header: .2, footer: .2}},

    const totals = MARKS.map(([k]) => k), last = 2 + n + totals.length;
    const fill = c => ({type: 'pattern', pattern: 'solid', fgColor: {argb: 'FF' + c}});
    const thin = {style: 'thin', color: {argb: 'FFBFBFBF'}}, border = {top: thin, left: thin, bottom: thin, right: thin};
    const COL = {P: ['E2F0D9', '375623'], A: ['F8D7DA', 'C00000'], L: ['DDEBF7', '1F4E79'], S: ['FFF2CC', '7F6000'], O: ['EDEDED', '595959']};

    ws.getRow(3).height = 6;
    const h1 = ws.getRow(4), h2 = ws.getRow(5);
    h1.values = ['No', 'Name', ...[...Array(n)].map((_, i) => i + 1), ...totals];
    h2.values = ['', '', ...[...Array(n)].map((_, i) => 'SMTWTFS'[dow(i + 1)]), ...totals.map(() => '')];
    ws.mergeCells(4, 1, 5, 1); ws.mergeCells(4, 2, 5, 2); totals.forEach((_, i) => ws.mergeCells(4, 3 + n + i, 5, 3 + n + i));
    [h1, h2].forEach(r => { r.height = 18; for (let c = 1; c <= last; c++) { const cell = r.getCell(c);
      const d = c - 2, isDay = d >= 1 && d <= n, isTot = c > 2 + n;

const TRIP = {TO: {name: 'To Naqoura', route: 'Sector West → UNIFIL HQ Naqoura'}, FROM: {name: 'From Naqoura', route: 'UNIFIL HQ Naqoura → Sector West'}};

const recOf = (date, T) => (S.cvDays[date] || {})[T];
const hasTrip = T => !!recOf(S.cvDate, T);
const tripOf = T => recOf(S.cvDate, T) || {people: {}, drivers: {}};
// a person is on a trip when they have an entry in its "people" map; the value is the car plate ('' = no car yet)
const onTrip = (T, key) => typeof tripOf(T).people[key] === 'string';
const carOf = (T, key) => onTrip(T, key) ? tripOf(T).people[key] : '';
const tripStaff = T => S.cvStaff.filter(s => onTrip(T, s.key));
const dayCount = (date, T) => { const r = recOf(date, T); return r ? Object.keys(r.people).length : 0; };
const hasList = date => dayCount(date, 'TO') + dayCount(date, 'FROM') > 0;
function tripSnapshot(T){
  return {dir: T, date: S.cvDate,
    staff: tripStaff(T).sort(bySection).map(s => ({key: s.key, no: s.no, name: s.name, idNo: s.idNo || '', section: s.section || '', phone: s.phone || '', plate: carOf(T, s.key)})),
    vehicles: cvVehicleSummary(T)}; }
// what a date looked like: past dates use what was stored that day
function daySnapshot(T){ const r = recOf(S.cvDate, T);
  if (!cvEditable() && r && r.staff) return {dir: T, date: S.cvDate, staff: r.staff, vehicles: r.vehicles || []};
  return tripSnapshot(T); }
// every change is saved at once under the date; a list with nobody on it is removed
function tripSet(T, patch){ if (!cvEditable()) return Promise.resolve();
  const date = S.cvDate, d = S.cvDays[date] = S.cvDays[date] || {};
  d[T] = {...tripOf(T), ...patch, src: 'day'}; const snap = tripSnapshot(T); render();
  const ref = db.collection('convoyInfo').doc('day_' + date + '_' + T);

async function cvCarSave(){ const T = cvT();

let cvLibs = null;
function cvLoadLibs(){ return cvLibs || (cvLibs = ['convoy/docx.umd.js', 'convoy/jspdf.umd.min.js', 'convoy/gen.js'].reduce((p, src) => p.then(() => new Promise((ok, no) => {
  const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = () => { cvLibs = null; no(new Error('The Word/PDF tools did not load. Check that the convoy folder was uploaded with the site.')); }; document.head.appendChild(sc); })), Promise.resolve())); }
async function cvCardImage(key){ let src = S.cvCards[key];
  if (!src) { const d = await db.collection('convoyCards').doc(key).get(); src = d.exists ? d.data().img : ''; }
  if (!src) return null;
  const im = await loadImg(src); const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight; c.getContext('2d').drawImage(im, 0, 0);
  const dataUrl = c.toDataURL('image/jpeg', .9); const bin = atob(dataUrl.split(',')[1]); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return {bytes, w: c.width, h: c.height, dataUrl}; }
function saveBlob(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
async function cvBuild(sv, kind){ await cvLoadLibs(); const list = [];
  for (const s of sv.staff) { let img = null; try { img = await cvCardImage(s.key); } catch (e) {} list.push({...s, img}); }
  const info = {date: sv.date, direction: sv.dir, vehicles: sv.vehicles || []};
  const blob = kind === 'docx' ? await docx.Packer.toBlob(ConvoyGen.buildDocx(docx, info, list)) : ConvoyGen.buildPdf(jspdf.jsPDF, info, list).output('blob');
  return {blob, name: ConvoyGen.fileBase(info) + '.' + kind}; }
async function cvOut(kind, view){ const sv = daySnapshot(cvT()); if (!sv.staff.length || S.cvBusy) return;
  // open the tab right away, so the browser does not block it as a pop-up
  const w = view ? window.open('', '_blank') : null; if (w) w.document.write('<p style="font:16px sans-serif;padding:20px">Preparing the PDF…</p>');
  S.cvBusy = true; render(); if (!view) toast('Preparing ' + kind.toUpperCase() + '…');
  try { const r = await cvBuild(sv, kind);
    if (view && w) { w.location.href = URL.createObjectURL(r.blob); }
    else { saveBlob(r.blob, r.name); toast('Downloaded ' + r.name); } }
  catch (e) { console.warn(e); if (w) w.close(); toast('Could not create the file. ' + (e && e.message || 'Try again.')); }
  finally { S.cvBusy = false; render(); } }

function authError(err){
  const c = err && err.code || '';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'Email or password is wrong. First time here? Create an account.';
  if (c.includes('email-already-in-use')) return 'This email already has an account. Sign in instead.';
  if (c.includes('weak-password')) return 'Use a password with at least 6 characters.';
  if (c.includes('invalid-email')) return 'That email address is not valid.';
  if (c.includes('too-many-requests')) return 'Too many tries. Wait a few minutes and try again.';
  return 'Something went wrong. Check your connection and try again.';
}

    if (!list.length) { toast('Those sites are already in the list'); return; }
